# Local development + test infrastructure for Waresport Sales Hub.
# One service: a real PostgreSQL database. The app sends no email.
services:
  db:
    image: postgres:17-alpine
    container_name: waresport_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waresport
      # Deterministic collation so ORDER BY results match across machines.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '54329:5432'
    volumes:
      - waresport_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d waresport']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  waresport_pgdata:

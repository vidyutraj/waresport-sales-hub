name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pushed branch supersedes its own in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. Nothing here needs write access.
permissions:
  contents: read

env:
  # Local throwaway database; no secret is involved and none is needed.
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/waresport
  # The migration creates this role with this default password.
  APP_DATABASE_URL: postgres://waresport_app:waresport_app_dev@127.0.0.1:5432/waresport
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  APP_URL: http://127.0.0.1:3000

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waresport
          POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d waresport"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate
        env:
          # The app role's password is created by the migration itself.
          PGPASSWORD: postgres

      - name: Verify (format, lint, types, unit + integration tests, build)
        run: npm run verify

  e2e:
    name: Acceptance (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waresport
          POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d waresport"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the job on a known high or critical advisory in the dependency
      # tree. Lower severities are reported without blocking a merge.
      - run: npm audit --audit-level=high
